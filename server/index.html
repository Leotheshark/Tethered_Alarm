<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 設定網頁的編碼與基本資訊 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tethered Alarm - Lobby</title>

    <!-- 引入外部工具：Socket.io 的客戶端程式碼，讓我們能跟伺服器說話 -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        /* 定義 CSS 變數，預設值為你現在喜歡的這四個顏色 */
        :root {
            --player-blue: #54a0ff;
            --player-green: #5fcf80;
            --player-pink: #ff80bf;
            --player-red: #ff4d4d;
        }

        /* 基礎排版：讓所有東西在畫面中間排成一列 */
        body {
            background-color: #ffebd0; /* 更低對比、柔和的米灰色 */
            color: #7a7570;            /* 低對比的暖灰色 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 上：鬧鐘時間 */
        .alarm-clock {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 50px;
            color: #a69076;            /* 低對比的褐色 */
            text-shadow: none;         /* 移除陰影以達成平面化 */
        }

        /* 中：玩家角色區域 */
        
        .players-container {
            display: flex;
            gap: 60px;
            margin-bottom: 100px;
            height: 100px;
            align-items: flex-end;
        }

        /* 單個玩家的插槽 (文字 + 圓圈) */
        .player-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 125px;
        }

        /* 角色頭上的 Ready! 字樣 */
        .ready-label {
            color: #ff6b6b;            /* 鮮明但不刺眼的珊瑚紅 */
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2rem;
            visibility: hidden; /* 預設隱藏 */
            text-transform: uppercase;
        }

        /* 圓形角色 */
        .character-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #d1cec7; /* 淺灰底色 */
            opacity: 0.15;             /* 未連線時更暗淡 */
            transition: all 0.4s ease; /* 變亮時有平滑動畫 */
        }

        /* Ready 按鈕預設隱藏 */
        /* 四種顏色 */
        .blue { background-color: var(--player-blue); }
        .green { background-color: var(--player-green); }
        .pink { background-color: var(--player-pink); }
        .red { background-color: var(--player-red); }

        /* 下：Ready 按鈕 */
        .ready-button {
            background-color: #fa5c5c; /* 鮮明但不刺眼的珊瑚紅 */
            color: white;
            border: 3px solid #e05252; /* 稍微深一點的紅色邊框 */
            padding: 15px 60px;
            font-size: 1.5rem;
            display: none; /* 預設隱藏，鬧鐘響後才顯示 */
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: none;          /* 移除立體感陰影 */
        }

        .ready-button:hover {
            background-color: #c83f3f; /* 滑鼠移上去時稍微深一點 */
        }

        .ready-button:active {
            transform: none;           /* 移除縮放效果以達成平面化 */
        }

        /* Ready 按鈕被按下 (active) 時的樣式 */
        .ready-button.active {
            background-color: #ae2f2f; /* 按下後的暗紅色，代表已準備 */
            transform: none;           /* 移除位移效果 */
        }

        /* 右上角房間資訊與邀請按鈕 */
        .room-info {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            color: #a69076;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .lang-btn {
            background: none;
            border: 2px solid #d1cec7;
            color: #a69076;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 0.9rem;
            align-self: flex-end;
        }
        .invite-btn {
            background: none;
            border: 2px solid #d1cec7;
            color: #a69076;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .invite-btn:hover {
            background-color: #d1cec7;
            color: white;
        }

        /* 倒數計時遮罩層：全螢幕紅色大數字 */
        #countdown-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(242, 237, 228, 0.95);
            display: none; /* 預設隱藏 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 8rem; /* 特大號數字 */
            color: #ff0000;  /* 純紅色倒數 */
            z-index: 100;
        }
        
        /* 鬧鐘下方的紅字提示 */
        #alarm-hint {
            color: #ff4d4d;
            font-size: 1.1rem;
            margin-top: -30px;
            margin-bottom: 30px;
            font-weight: bold;
            visibility: hidden;
        }

        /* 睡眠模式遮罩層：全螢幕深藍色 */
        #sleep-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a2e;
            display: none; /* 預設隱藏 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e94560;
            z-index: 90;
        }
        .sleep-text {
            font-size: 2rem;
            margin-top: 20px;
            letter-spacing: 5px;
        }
    </style>

    <!-- 房間已滿提示遮罩 -->
    <div id="room-full-overlay">
        <div class="room-full-content">
            <div style="font-size: 5rem;">🚫</div>
            <div class="room-full-text" id="text-room-full">此房間人數已滿</div>
            <button id="btn-try-another-room">嘗試其他房間</button>
        </div>
    </div>

    <style>
        #room-full-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; /* 預設隱藏 */
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 120; color: white;
        }
        .room-full-content { text-align: center; }
        .room-full-text { font-size: 2.5rem; margin-top: 20px; margin-bottom: 30px; }
        #btn-try-another-room {
            padding: 15px 30px; font-size: 1.2rem; font-weight: bold;
            background-color: #54a0ff; color: white; border: none; border-radius: 8px;
            cursor: pointer; transition: background-color 0.2s;
        }
        #btn-try-another-room:hover { background-color: #3a80d0; }
    </style>
</head>
<body>

    <!-- 房間資訊與邀請連結 -->
    <div class="room-info">
        <button class="lang-btn" onclick="toggleLanguage()">English / 中文</button>
        <div><span id="text-room-id-label">ROOM ID</span>: <span id="displayRoomId">----</span></div>
        <button class="invite-btn" id="btn-invite" onclick="copyInviteLink()">Copy Invite Link</button>
    </div>

    <!-- 鬧鐘時間區域 -->
    <div class="alarm-clock" id="alarmTime">07:00</div>
    
    <!-- 鬧鐘下方提示 (僅在 4 人到齊時顯示) -->
    <div id="alarm-hint">All players here! Host can set the alarm.</div>

    <!-- 角色插槽區域 -->
    <div class="players-container">
        <div class="player-slot" id="slot-blue">
            <div class="ready-label">Ready!</div>
            <div class="character-circle blue"></div>
        </div>
        <div class="player-slot" id="slot-green">
            <div class="ready-label">Ready!</div>
            <div class="character-circle green"></div>
        </div>
        <div class="player-slot" id="slot-pink">
            <div class="ready-label">Ready!</div>
            <div class="character-circle pink"></div>
        </div>
        <div class="player-slot" id="slot-red">
            <div class="ready-label">Ready!</div>
            <div class="character-circle red"></div>
        </div>
    </div>

    <!-- 準備按鈕 -->
    <button class="ready-button" onclick="sendReady()">READY</button>

    <!-- 倒數計時層 -->
    <div id="countdown-overlay">
        <div id="text-starting" style="font-size: 1.5rem; margin-bottom: 20px; color: #7a7570;">GAME STARTING IN</div>
        <div id="countdown-number">3</div>
    </div>

    <!-- 睡眠模式層 (鬧鐘設定後顯示) -->
    <div id="sleep-overlay">
        <div style="font-size: 5rem;">🌙</div>
        <div id="display-set-alarm-time" style="font-size: 2rem; margin-top: 10px; color: #e94560;"></div>
        <div class="sleep-text" id="text-sleeping">SLEEPING...</div>
    </div>

    <!-- 時間選擇器模態框 -->
    <div id="time-picker-modal">
        <div class="time-picker-content">
            <div class="time-display">
                <div class="time-part">
                    <button class="time-btn up" data-unit="hour"></button>
                    <span id="picker-hour">08</span>
                    <button class="time-btn down" data-unit="hour"></button>
                </div>
                <span class="separator">:</span>
                <div class="time-part">
                    <button class="time-btn up" data-unit="minute"></button>
                    <span id="picker-minute">30</span>
                    <button class="time-btn down" data-unit="minute"></button>
                </div>
            </div>
            <div class="picker-actions">
                <button id="set-time-btn">設定</button>
                <button id="cancel-time-btn">取消</button>
            </div>
        </div>
        <!-- 顯示剩餘時間 -->
        <div id="time-remaining-hint" style="color: white; margin-top: 15px; font-size: 1.2rem; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;"></div>
    </div>

    <style>
        /* 時間選擇器模態框樣式 */
        #time-picker-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none; /* 預設隱藏 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 110; /* 確保在其他遮罩之上 */
        }
        .time-picker-content {
            background: #ffebd0;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .time-display {
            display: flex;
            align-items: center;
            font-size: 4rem;
            font-weight: bold;
            color: #7a7570;
        }
        .time-part {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .separator { margin: 0 10px; }
        .time-btn {
            background: #d1cec7; border: none; border-radius: 5px; width: 50px; height: 30px; font-size: 1.5rem; cursor: pointer; color: #7a7570; transition: background-color 0.2s;
        }
        .time-btn:hover { background-color: #a69076; color: white; }
        .time-btn.up::before { content: '▲'; }
        .time-btn.down::before { content: '▼'; }
        .picker-actions { display: flex; gap: 15px; }
        .picker-actions button { padding: 10px 20px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.2s; }
        #set-time-btn { background-color: #5fcf80; color: white; }
        #set-time-btn:hover { background-color: #40a050; }
        #cancel-time-btn { background-color: #fa5c5c; color: white; }
        #cancel-time-btn:hover { background-color: #c83f3f; }
    </style>
    <script>
        // --- 語系設定 (i18n) ---
        const translations = {
            'zh': {
                'room_id_label': '房間 ID',
                'invite_btn': '複製邀請連結',
                'invite_success': '邀請連結已複製到剪貼簿！',
                'room_prompt': '請輸入房間 ID 以建立或加入房間：',
                'host_prompt': '你是房長，請輸入鬧鐘設定時間 (例如 08:30):',
                'game_starting': '遊戲即將開始',
                'ready': '準備！',
                'room_full': '該房間已滿 (最多 4 人)！', // <--- 這裡補上了逗號
                'set_time': '設定',
                'cancel_time': '取消',
                'sleeping': '睡眠中...',
                'room_full_message': '此房間人數已滿',
                'try_another_room': '嘗試其他房間',
                'alarm_hint': '全員到齊！房長可以點擊時鐘設定鬧鐘了',
                'time_until': '鬧鐘將在 $t 後響起',
                'alarm_time_prefix': '訂下的起床時間：'
            },
            'en': {
                'room_id_label': 'ROOM ID',
                'invite_btn': 'Copy Invite Link',
                'invite_success': 'Invite link copied to clipboard!',
                'room_prompt': 'Enter Room ID to create or join:',
                'host_prompt': 'You are Host, enter alarm time (e.g., 08:30):',
                'game_starting': 'GAME STARTING IN',
                'ready': 'READY!',
                'room_full': 'Room is full (max 4 players)!', // <--- 這裡也補上了逗號
                'set_time': 'Set',
                'cancel_time': 'Cancel',
                'sleeping': 'SLEEPING...',
                'room_full_message': 'This room is full',
                'try_another_room': 'Try another room',
                'alarm_hint': 'All players here! Host can set the alarm.',
                'time_until': 'Alarm in: $t',
                'alarm_time_prefix': 'Set Alarm Time: '
            }
        };

        let currentLang = 'en'; // 預設語言

        function updateLanguage() {
            const t = translations[currentLang];
            document.getElementById('text-room-id-label').textContent = t.room_id_label;
            document.getElementById('btn-invite').textContent = t.invite_btn;
            document.getElementById('text-starting').textContent = t.game_starting;
            document.querySelectorAll('.ready-label').forEach(el => el.textContent = t.ready);
            document.getElementById('text-sleeping').textContent = t.sleeping;
            document.getElementById('set-time-btn').textContent = t.set_time;
            document.getElementById('cancel-time-btn').textContent = t.cancel_time;
            document.getElementById('text-room-full').textContent = t.room_full_message;
            document.getElementById('btn-try-another-room').textContent = t.try_another_room;
            document.getElementById('alarm-hint').textContent = t.alarm_hint;
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            updateLanguage();
        }

        const alarmClock = document.getElementById('alarmTime'); // 取得時鐘元素

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            alarmClock.textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- UI 元素定義 ---
        const readyButton = document.querySelector('.ready-button'); 
        const timePickerModal = document.getElementById('time-picker-modal');
        const pickerHourSpan = document.getElementById('picker-hour');
        const pickerMinuteSpan = document.getElementById('picker-minute');
        const setTimeBtn = document.getElementById('set-time-btn');
        const cancelTimeBtn = document.getElementById('cancel-time-btn');

        const urlParams = new URLSearchParams(window.location.search);
        let ROOM_ID = urlParams.get('room');
        
        // 初始化 UI
        updateLanguage();

        // --- SocketManager 類別定義 ---
        // 這個類別負責所有與 Socket.IO 伺服器的通訊邏輯
        class SocketManager {
            constructor(serverUrl, roomId, uiCallbacks) {
                this.socket = io(serverUrl);
                this.ROOM_ID = roomId;
                this.currentHostSid = null; // 房長 SID
                this.uiCallbacks = uiCallbacks; // 外部傳入的 UI 更新函式集合

                this._setupEventListeners();
            }

            // 設定所有 Socket.IO 事件監聽器
            _setupEventListeners() {
                this.socket.on("connect", () => {
                    console.log("連線成功，身分證 ID:", this.socket.id);
                    this.joinRoom(this.ROOM_ID); // 連線成功後立即加入房間
                    if (this.uiCallbacks.onConnect) {
                        this.uiCallbacks.onConnect(this.socket.id);
                    }
                });

                this.socket.on("room_state", (state) => {
                    this.currentHostSid = state.host_sid; // 更新房長 SID
                    if (this.uiCallbacks.onRoomStateUpdate) {
                        this.uiCallbacks.onRoomStateUpdate(state, this.socket.id);
                    }
                });

                this.socket.on("all_ready", (data) => {
                    if (this.uiCallbacks.onAllReady) {
                        this.uiCallbacks.onAllReady(data);
                    }
                });

                this.socket.on("alarm_set", (data) => {
                    if (this.uiCallbacks.onAlarmSet) {
                        this.uiCallbacks.onAlarmSet(data);
                    }
                });

                this.socket.on("alarm_triggered", (data) => {
                    if (this.uiCallbacks.onAlarmTriggered) {
                        this.uiCallbacks.onAlarmTriggered(data);
                    }
                });

                this.socket.on("join_failed", (data) => {
                    if (this.uiCallbacks.onJoinFailed) {
                        this.uiCallbacks.onJoinFailed(data);
                    }
                });

                this.socket.on("game_started", () => {
                    if (this.uiCallbacks.onGameStarted) {
                        this.uiCallbacks.onGameStarted();
                    }
                });
            }

            // 發送加入房間請求
            joinRoom(roomId) {
                if (roomId) {
                    this.socket.emit("join_room", { room_id: roomId });
                }
            }

            // 發送準備/取消準備狀態
            sendReadyStatus(isReady) {
                if (isReady) {
                    this.socket.emit("player_ready", { room_id: this.ROOM_ID });
                } else {
                    this.socket.emit("player_unready", { room_id: this.ROOM_ID });
                }
            }

            // 發送鬧鐘設定時間 (只有房長能發送)
            sendAlarmTime(time) {
                this.socket.emit("set_alarm", { room_id: this.ROOM_ID, time: time });
            }

            // 發送遊戲開始指令 (倒數結束後發送)
            sendStartGame() {
                this.socket.emit("start_game", { room_id: this.ROOM_ID });
            }

            // 判斷當前玩家是否為房長
            isHost() {
                return this.socket.id === this.currentHostSid;
            }
        }

        // --- UI 回呼函式定義 ---
        // 這些函式會被 SocketManager 呼叫，用來更新介面
        const uiCallbacks = {
            onConnect: (socketId) => {
                // 連線成功時的 UI 處理，目前沒有特別需要
            },
            onRoomStateUpdate: (state, currentSocketId) => {
                // 1. 先把所有圓圈變暗，隱藏所有 Ready 字樣
                document.querySelectorAll('.character-circle').forEach(el => {
                    el.style.opacity = "0.2";
                });
                document.querySelectorAll('.ready-label').forEach(el => el.style.visibility = "hidden");

                // 2. 根據伺服器傳來的玩家資料進行點亮
                for (const sid in state.players) {
                    const player = state.players[sid];
                    const slot = document.getElementById(`slot-${player.color}`);
                    if (slot) {
                        slot.querySelector('.character-circle').style.opacity = "1.0"; // 變亮
                        if (player.ready) {
                            slot.querySelector('.ready-label').style.visibility = "visible"; // 顯示 Ready!
                        }
                    }
                }

                // 3. 更新當前玩家的按鈕亮度 (變暗代表已準備)
                if (state.players[currentSocketId] && state.players[currentSocketId].ready) {
                    readyButton.classList.add('active'); // 加入 active 類別使其變暗
                } else {
                    readyButton.classList.remove('active'); // 移除類別恢復原始亮度
                }

                // 4. 鬧鐘設定權限控制
                const isHost = currentSocketId === state.host_sid;
                const isFull = state.count === 4;
                const alarmHint = document.getElementById('alarm-hint');
                const hasTriggered = alarmHint.dataset.triggered === "true";
                
                // 簡化邏輯：只要鬧鐘已設定或已觸發，就視為「忙碌」狀態
                const isBusy = !!state.alarm_time || hasTriggered;

                // 只有房長且滿足條件（滿人且非忙碌）時，游標才顯示為手指
                alarmClock.style.cursor = (isHost && isFull && !isBusy) ? "pointer" : "default";

                // 5. 更新紅字提示：滿 4 人且目前非忙碌狀態時顯示
                alarmHint.style.visibility = (isFull && !isBusy) ? "visible" : "hidden";

                // 如果人數不足，重設觸發標記，讓下一輪滿人時還能重新看到設定提示
                if (!isFull) alarmHint.dataset.triggered = "false";
            },
            onAllReady: (data) => {
                // 1. 固定畫面：禁用按鈕，防止玩家在倒數期間取消準備
                readyButton.disabled = true;
                readyButton.style.cursor = "not-allowed";
                readyButton.style.opacity = "0.6";

                // 2. 顯示倒數遮罩
                const overlay = document.getElementById('countdown-overlay');
                const num = document.getElementById('countdown-number');
                overlay.style.display = 'flex';
                
                let count = data.countdown;
                num.textContent = count;

                const timer = setInterval(() => {
                    count--;
                    if (count <= 0) {
                        clearInterval(timer);
                        num.textContent = "GO!";
                        // 3. 倒數結束，向伺服器發送遊戲開始指令
                        socketManager.sendStartGame(); // 使用 SocketManager 發送
                    } else {
                        num.textContent = count;
                    }
                }, 1000);
            },
            onAlarmSet: (data) => {
                // 房長設定完時間，大家進入睡眠狀態
                document.getElementById('sleep-overlay').style.display = 'flex';
                const t = translations[currentLang];
                document.getElementById('display-set-alarm-time').textContent = `${t.alarm_time_prefix}${data.time}`;
                console.log("鬧鐘已設定，進入睡眠模式...");
            },
            onAlarmTriggered: (data) => {
                const alarmHint = document.getElementById('alarm-hint');
                // 時間到！移除睡眠遮罩，跳轉（顯現）回大廳
                document.getElementById('sleep-overlay').style.display = 'none';
                console.log("時間到！喚醒玩家！");
                // 這裡可以加入播放鬧鐘鈴聲的邏輯
                readyButton.style.display = 'block'; // 鬧鐘響起後顯示 Ready 按鈕
                alarmHint.style.visibility = 'hidden'; // 鬧鐘響起後隱藏紅字提示
                alarmHint.dataset.triggered = "true"; // 標記已進入準備階段，防止 room_state 更新時重新顯示
            },
            onJoinFailed: (data) => {
                if (data.reason === 'full') {
                    // 顯示房間已滿的遮罩
                    document.getElementById('room-full-overlay').style.display = 'flex';
                }
            },
            // 新增：用來動態同步顏色設定的函式
            updateColorPalette: (colorMap) => {
                // 如果伺服器傳來新的顏色 (RGB)，我們可以在這裡更新 CSS 變數
                // 例如 colorMap = {"blue": [84, 160, 255], ...}
                for (const [name, rgb] of Object.entries(colorMap)) {
                    document.documentElement.style.setProperty(
                        `--player-${name}`, 
                        `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`
                    );
                }
                console.log("顏色面板已根據 constants.py 更新");
            },
            onGameStarted: () => {
                console.log("伺服器確認：遊戲正式開始！");
                // 這裡未來可以切換到 Canvas 遊戲畫面或隱藏大廳元素
            }
        };

        // --- 時間選擇器邏輯 ---
        let selectedHour = 8; // 預設小時
        let selectedMinute = 30; // 預設分鐘

        function updatePickerDisplay() {
            pickerHourSpan.textContent = String(selectedHour).padStart(2, '0');
            pickerMinuteSpan.textContent = String(selectedMinute).padStart(2, '0');

            // 計算還有多久響起
            const now = new Date();
            let alarmDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), selectedHour, selectedMinute, 0);
            
            // 如果時間已經過了，代表是明天
            if (alarmDate <= now) {
                alarmDate.setDate(alarmDate.getDate() + 1);
            }

            const diffMs = alarmDate - now;
            const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            const t = translations[currentLang];
            let timeStr = "";
            if (currentLang === 'zh') {
                timeStr = `${diffHrs} 小時 ${diffMins} 分鐘`;
            } else {
                timeStr = `${diffHrs}h ${diffMins}m`;
            }
            document.getElementById('time-remaining-hint').textContent = t.time_until.replace('$t', timeStr);
        }

        function showTimePicker() {
            timePickerModal.style.display = 'flex';
            // 初始化為當前時間或上次設定的時間
            const now = new Date();
            selectedHour = now.getHours();
            selectedMinute = now.getMinutes();
            updatePickerDisplay();
        }

        function hideTimePicker() {
            timePickerModal.style.display = 'none';
        }

        // 長按切換邏輯
        let pressTimer, repeatInterval;

        function handleTimeChange(unit, isUp) {
            if (unit === 'hour') {
                selectedHour = isUp ? (selectedHour + 1) % 24 : (selectedHour - 1 + 24) % 24;
            } else {
                selectedMinute = isUp ? (selectedMinute + 1) % 60 : (selectedMinute - 1 + 60) % 60;
            }
            updatePickerDisplay();
        }

        document.querySelectorAll('.time-btn').forEach(button => {
            const unit = button.dataset.unit;
            const isUp = button.classList.contains('up');

            // 滑鼠按下時啟動定時器
            button.onmousedown = (e) => {
                e.preventDefault();
                handleTimeChange(unit, isUp); // 先執行一次

                // 延遲 500ms 後啟動快速切換
                pressTimer = setTimeout(() => {
                    repeatInterval = setInterval(() => {
                        handleTimeChange(unit, isUp);
                    }, 100); // 每 100ms 切換一次
                }, 500);
            };

            // 滑鼠放開或移開時清除定時器
            const stopPress = () => {
                clearTimeout(pressTimer);
                clearInterval(repeatInterval);
            };

            button.onmouseup = stopPress;
            button.onmouseleave = stopPress;
            
            // 支援觸控設備
            button.ontouchstart = button.onmousedown;
            button.ontouchend = stopPress;
        });

        setTimeBtn.onclick = () => {
            const time = `${String(selectedHour).padStart(2, '0')}:${String(selectedMinute).padStart(2, '0')}`;
            socketManager.sendAlarmTime(time);
            hideTimePicker();
        };

        cancelTimeBtn.onclick = () => {
            hideTimePicker();
        };

        let socketManager = null;

        function startApp() {
            // 1. 強制房號輸入 (不允許空白或取消)
            while (!ROOM_ID || !ROOM_ID.trim()) {
                ROOM_ID = prompt(translations[currentLang].room_prompt, "room-" + Math.floor(Math.random() * 1000));
            }
            document.getElementById('displayRoomId').textContent = ROOM_ID;

            socketManager = new SocketManager(window.location.origin, ROOM_ID, uiCallbacks);

            // 綁定時鐘點擊 (僅房長可操作)
            alarmClock.onclick = () => {
                if (socketManager?.isHost() && alarmClock.style.cursor === "pointer") showTimePicker();
            };
        }
        
        // 啟動入口
        startApp();

        // --- UI 按鈕事件實作 ---
        function sendReady() {
            if (socketManager) {
                const isReady = !readyButton.classList.contains('active');
                socketManager.sendReadyStatus(isReady);
            }
        }

        function copyInviteLink() {
            const url = `${window.location.origin}${window.location.pathname}?room=${ROOM_ID}`;
            navigator.clipboard.writeText(url).then(() => alert(translations[currentLang].invite_success));
        }

        document.getElementById('btn-try-another-room').onclick = () => {
            window.location.href = window.location.pathname;
        };
    </script>
</body>
</html>
